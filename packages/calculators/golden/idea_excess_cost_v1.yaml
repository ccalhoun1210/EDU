calculator: idea_excess_cost_v1
authority:
  - 34 CFR 300.202(b)
  - 34 CFR 300.16
  - Appendix A to 34 CFR part 300
  - 20 U.S.C. 1401(8)
  - 20 U.S.C. 1413(a)(2)(A)
notes: >-
  No regulatory text was retrieved when these cases were written. eCFR is unreachable from the
  authoring environment (ADR 0006), so every statement here about what the regulation requires
  is an unverified paraphrase and IDEA-EXCESS-COST-001 is held at DRAFT. Read
  docs/regulatory-methodology/idea-excess-cost.md first; it carries the input dictionary, the
  algorithm and the nine open questions, the first of which decides whether this calculator is
  measuring the right thing at all. Four properties of this corpus are deliberate. First,
  elementary and secondary are computed separately and never combined, and the roll-up is
  FAIL-dominant because the two are separate obligations rather than alternative methods - the
  opposite of maintenance of effort, where satisfying any one of four methods satisfies the
  standard. Second, a threshold of nothing is never a requirement satisfied: a level with no
  children with disabilities is NOT_APPLICABLE and a net base of zero is refused, both because
  an earlier specification returned PASS for them. Third, absent and zero are different facts
  throughout and produce different statuses. Fourth, the calculator computes a threshold and
  compares it; it does not verify that what a district charged to Part B beyond the threshold
  was in fact an excess cost. Every figure below is synthetic and Northfield Consolidated is
  invented.

cases:
  - case: elementary-clears-the-threshold-while-secondary-falls-short
    intent: fail
    asserts: >-
      The minimum amount an LEA must spend before using Part B funds is computed separately for
      elementary and for secondary students, and a shortfall at either level is a failure - the
      levels are separate obligations and may not be averaged against one another.
    inputs:
      serves_elementary: true
      serves_secondary: true
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '6500000.00'
      elementary_capital_outlay: '300000.00'
      elementary_debt_service: '100000.00'
      elementary_part_b_expenditures: '200000.00'
      elementary_esea_title_i_a_expenditures: '250000.00'
      elementary_esea_title_iii_expenditures: '50000.00'
      elementary_state_local_sped_expenditures: '500000.00'
      elementary_state_local_esea_expenditures: '150000.00'
      elementary_enrollment_preceding_year: 900
      elementary_children_with_disabilities: 100
      elementary_non_part_b_spend_on_children: '562000.00'
      secondary_total_expenditures: '4800000.00'
      secondary_capital_outlay: '200000.00'
      secondary_debt_service: '50000.00'
      secondary_part_b_expenditures: '150000.00'
      secondary_esea_title_i_a_expenditures: '120000.00'
      secondary_esea_title_iii_expenditures: '30000.00'
      secondary_state_local_sped_expenditures: '400000.00'
      secondary_state_local_esea_expenditures: '50000.00'
      secondary_enrollment_preceding_year: 500
      secondary_children_with_disabilities: 60
      secondary_non_part_b_spend_on_children: '431000.00'
    expect:
      status: FAIL
      missingInputs: []
      output:
        levelStatus:
          ELEMENTARY: PASS
          SECONDARY: FAIL
        averagePerStudentByLevel:
          ELEMENTARY: '5500.000000'
          SECONDARY: '7600.000000'
        minimumRequiredByLevel:
          ELEMENTARY: '550000.00'
          SECONDARY: '456000.00'
        marginByLevel:
          ELEMENTARY: '12000.00'
          SECONDARY: '-25000.00'
        shortfallByLevel:
          ELEMENTARY: '0.00'
          SECONDARY: '25000.00'
      steps:
        elementary_net_base: '4950000.00'
        elementary_minimum_required: '550000.00'
        secondary_net_base: '3800000.00'
        secondary_minimum_required: '456000.00'
    derivation: |
      ELEMENTARY
        Total expenditures, all sources, preceding year        6,500,000.00
          less capital outlay                                    300,000.00
          less debt service                                      100,000.00
        Adjusted total                                         6,100,000.00
          less Part B expended                                   200,000.00
          less ESEA Title I Part A expended                      250,000.00
          less ESEA Title III Parts A and B expended              50,000.00
          less State and local funds for children w/ disab.      500,000.00
          less State and local funds for qualifying ESEA         150,000.00
        Total deducted                                         1,150,000.00
        Net base = 6,100,000.00 - 1,150,000.00               = 4,950,000.00
        Average per student = 4,950,000.00 / 900             =     5,500.000000
        Minimum required    = 5,500.000000 x 100             =   550,000.00
        Actual non-Part-B spend on those children                562,000.00
        Margin = 562,000.00 - 550,000.00                     =    12,000.00  -> PASS

      SECONDARY
        Total expenditures, all sources, preceding year        4,800,000.00
          less capital outlay                                    200,000.00
          less debt service                                       50,000.00
        Adjusted total                                         4,550,000.00
          less Part B expended                                   150,000.00
          less ESEA Title I Part A expended                      120,000.00
          less ESEA Title III Parts A and B expended              30,000.00
          less State and local funds for children w/ disab.      400,000.00
          less State and local funds for qualifying ESEA          50,000.00
        Total deducted                                           750,000.00
        Net base = 4,550,000.00 - 750,000.00                 = 3,800,000.00
        Average per student = 3,800,000.00 / 500             =     7,600.000000
        Minimum required    = 7,600.000000 x 60              =   456,000.00
        Actual non-Part-B spend on those children                431,000.00
        Margin = 431,000.00 - 456,000.00                     =   -25,000.00  -> FAIL
        Shortfall                                                 25,000.00

      Roll-up: one level FAIL -> FAIL. Averaging the +12,000.00 elementary margin against the
      -25,000.00 secondary shortfall would report a district compliant at a level where it is
      25,000.00 short, which is exactly what computing the levels separately forbids.

  - case: both-levels-clear-their-own-threshold
    intent: pass
    asserts: >-
      An LEA that spent at least the average annual per-student expenditure on each child with
      a disability, at both levels, satisfies the excess cost requirement.
    inputs:
      serves_elementary: true
      serves_secondary: true
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '3200000.00'
      elementary_capital_outlay: '100000.00'
      elementary_debt_service: '100000.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '200000.00'
      elementary_esea_title_iii_expenditures: '50000.00'
      elementary_state_local_sped_expenditures: '550000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 800
      elementary_children_with_disabilities: 40
      elementary_non_part_b_spend_on_children: '105000.00'
      secondary_total_expenditures: '2400000.00'
      secondary_capital_outlay: '50000.00'
      secondary_debt_service: '50000.00'
      secondary_part_b_expenditures: '80000.00'
      secondary_esea_title_i_a_expenditures: '120000.00'
      secondary_esea_title_iii_expenditures: '20000.00'
      secondary_state_local_sped_expenditures: '280000.00'
      secondary_state_local_esea_expenditures: '100000.00'
      secondary_enrollment_preceding_year: 425
      secondary_children_with_disabilities: 25
      secondary_non_part_b_spend_on_children: '112000.00'
    expect:
      status: PASS
      missingInputs: []
      output:
        levelStatus:
          ELEMENTARY: PASS
          SECONDARY: PASS
        averagePerStudentByLevel:
          ELEMENTARY: '2500.000000'
          SECONDARY: '4000.000000'
        minimumRequiredByLevel:
          ELEMENTARY: '100000.00'
          SECONDARY: '100000.00'
        shortfallByLevel:
          ELEMENTARY: '0.00'
          SECONDARY: '0.00'
      steps:
        elementary_average_per_student: '2500.000000'
        secondary_average_per_student: '4000.000000'
    derivation: |
      ELEMENTARY
        Adjusted total = 3,200,000.00 - 100,000.00 - 100,000.00      = 3,000,000.00
        Deducted = 100,000 + 200,000 + 50,000 + 550,000 + 100,000    = 1,000,000.00
        Net base = 3,000,000.00 - 1,000,000.00                       = 2,000,000.00
        Average  = 2,000,000.00 / 800                                =     2,500.000000
        Minimum  = 2,500.000000 x 40                                 =   100,000.00
        Margin   = 105,000.00 - 100,000.00                           =     5,000.00 -> PASS

      SECONDARY
        Adjusted total = 2,400,000.00 - 50,000.00 - 50,000.00        = 2,300,000.00
        Deducted = 80,000 + 120,000 + 20,000 + 280,000 + 100,000     =   600,000.00
        Net base = 2,300,000.00 - 600,000.00                         = 1,700,000.00
        Average  = 1,700,000.00 / 425                                =     4,000.000000
        Minimum  = 4,000.000000 x 25                                 =   100,000.00
        Margin   = 112,000.00 - 100,000.00                           =    12,000.00 -> PASS

      Both levels PASS -> PASS. The two thresholds coincide at 100,000.00 from entirely
      different bases, which is a reminder that the figure means nothing without its level.

  - case: spending-exactly-the-minimum-satisfies-the-requirement
    intent: boundary
    asserts: >-
      An LEA whose non-Part-B spending equals the minimum required exactly satisfies the
      requirement, on the reading that spending at least the average means at or above it.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '120000.00'
    expect:
      status: PASS
      missingInputs: []
      output:
        levelStatus:
          ELEMENTARY: PASS
          SECONDARY: NOT_APPLICABLE
        marginByLevel:
          ELEMENTARY: '0.00'
        shortfallByLevel:
          ELEMENTARY: '0.00'
      steps:
        elementary_minimum_required: '120000.00'
        elementary_actual_spend: '120000.00'
    derivation: |
      Adjusted total = 1,500,000.00 - 0.00 - 0.00                  = 1,500,000.00
      Deducted = 100,000 + 100,000 + 0 + 200,000 + 100,000         =   500,000.00
      Net base = 1,500,000.00 - 500,000.00                         = 1,000,000.00
      Average  = 1,000,000.00 / 250                                =     4,000.000000
      Minimum  = 4,000.000000 x 30                                 =   120,000.00
      Margin   = 120,000.00 - 120,000.00                           =         0.00 -> PASS

      This case pins OQ-8. The comparative is asserted as >= and is NOT confirmed against
      retrieved text. If the regulation reads strictly greater than, this expectation is wrong
      and every district sitting exactly on its threshold has been told the opposite of the
      truth. The case exists so that resolving OQ-8 the other way fails loudly here rather than
      passing quietly everywhere.

  - case: a-level-with-no-children-with-disabilities-is-not-a-pass
    intent: not-applicable
    asserts: >-
      A level at which the LEA serves no children with disabilities produces a minimum of
      nothing, and a requirement of nothing is not a requirement satisfied - the level is
      NOT_APPLICABLE and never PASS.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 0
      elementary_non_part_b_spend_on_children: '0.00'
    expect:
      status: NOT_APPLICABLE
      missingInputs: []
      output:
        levelStatus:
          ELEMENTARY: NOT_APPLICABLE
          SECONDARY: NOT_APPLICABLE
        minimumRequiredByLevel:
          ELEMENTARY: '0.00'
        marginByLevel:
          ELEMENTARY: null
      warnings:
        - EXCESS_COST_NO_CHILDREN_AT_LEVEL
    derivation: |
      Average  = 1,000,000.00 / 250                                =     4,000.000000
      Minimum  = 4,000.000000 x 0                                  =         0.00
      Actual                                                                0.00
      Margin would be 0.00 - 0.00 = 0.00, which compares as satisfied.

      This is the first blocking finding recorded against the earlier specification: it returned
      PASS here. The threshold is vacuous - the requirement had nothing to attach to - so the
      level reports NOT_APPLICABLE with the count named, and carries no margin at all. Reporting
      PASS would put a satisfied-looking finding with a CFR citation against a question nobody
      asked, and would let a mis-mapped child count column launder a real obligation away.

  - case: an-absent-child-count-is-not-a-count-of-zero
    intent: missing-data
    asserts: >-
      An absent count of children with disabilities makes the level unanswerable, which is a
      different conclusion from the count being zero.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_non_part_b_spend_on_children: '120000.00'
    expect:
      status: INDETERMINATE
      missingInputs:
        - elementary_children_with_disabilities
      output:
        levelStatus:
          ELEMENTARY: INDETERMINATE
          SECONDARY: NOT_APPLICABLE
      steps:
        elementary_average_per_student: '4000.000000'
    derivation: |
      Everything up to the average computes: 1,000,000.00 / 250 = 4,000.000000. The
      multiplication that turns it into an obligation cannot run, so nothing follows.

      Compare the preceding case, which supplies a count of zero and reaches NOT_APPLICABLE.
      Same arithmetic to that point, different conclusion, because zero is the district's
      statement and absent is the platform's ignorance. The average is still shown: the work
      done before the gap is part of what a district is owed.

  - case: the-threshold-alone-is-not-a-finding
    intent: missing-data
    asserts: >-
      A minimum that computes cleanly is still not a conclusion; without the actual non-Part-B
      spending there is nothing to compare it against and the level is unanswerable.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
    expect:
      status: INDETERMINATE
      missingInputs:
        - elementary_non_part_b_spend_on_children
      output:
        minimumRequiredByLevel:
          ELEMENTARY: '120000.00'
        levelStatus:
          ELEMENTARY: INDETERMINATE
      steps:
        elementary_minimum_required: '120000.00'
    derivation: |
      Minimum = 4,000.000000 x 30 = 120,000.00, computed and shown.

      The threshold is not the finding; the comparison is. A district reading 120,000.00 on a
      screen has been told what it must clear, and telling it that much while the platform does
      not know what it spent is the honest half of an answer - which is why the step survives
      and the status does not.

  - case: an-absent-exclusion-is-not-a-zero-one
    intent: missing-data
    asserts: >-
      An absent capital outlay figure makes the level unanswerable rather than being treated as
      nothing; a district with no capital outlay reports zero.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '120000.00'
    expect:
      status: INDETERMINATE
      missingInputs:
        - elementary_capital_outlay
      output:
        levelStatus:
          ELEMENTARY: INDETERMINATE
    derivation: |
      Substituting zero for the absent exclusion would give an adjusted total of 1,500,000.00,
      an average of 4,000.000000 and a minimum of 120,000.00 - which the district would clear
      exactly. Substituting zero for an absent deduction runs the other way, inflating the base
      and the threshold against the district.

      Either way the platform would be computing against a figure nobody supplied. The
      distinction between absent and zero is the single thing most likely to produce a wrong
      finding on this rule, so it is pinned on an exclusion here and on a count above.

  - case: an-undeclared-level-is-not-a-level-the-district-does-not-operate
    intent: missing-data
    asserts: >-
      Whether the LEA operates a level is declared, never inferred from the absence of that
      level's figures; an undeclared level is unanswerable and outranks a satisfied one.
    inputs:
      serves_elementary: true
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '130000.00'
    expect:
      status: INDETERMINATE
      missingInputs:
        - serves_secondary
      output:
        levelStatus:
          ELEMENTARY: PASS
          SECONDARY: INDETERMINATE
    derivation: |
      Elementary: minimum 120,000.00 against 130,000.00 -> PASS with a margin of 10,000.00.

      Secondary supplies nothing at all. An LEA that operates secondary schools and failed to
      export their expenditures is indistinguishable, at the fact-bag level, from one that
      operates none - and guessing in the permissive direction excuses a level from a
      requirement that binds it. Only serves_secondary is recorded as missing: until the
      platform knows whether the level exists it cannot say which of its eleven figures were
      owed.

      Roll-up: an unanswered level outranks a satisfied one -> INDETERMINATE.

  - case: a-level-the-district-does-not-operate-is-not-applicable
    intent: not-applicable
    asserts: >-
      An LEA that operates neither elementary nor secondary schools has no excess cost
      obligation to test, and the requirement reports as inapplicable rather than satisfied.
    inputs:
      serves_elementary: false
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
    expect:
      status: NOT_APPLICABLE
      missingInputs: []
      output:
        levelStatus:
          ELEMENTARY: NOT_APPLICABLE
          SECONDARY: NOT_APPLICABLE
    derivation: |
      No level is operated, so no threshold exists and none of the twenty-two level inputs is
      read or reported missing.

      NOT_APPLICABLE rather than PASS, and the distinction is the whole point: a district shown
      PASS here would have a satisfied excess cost finding, with a CFR citation, on a
      requirement that never applied to it.

  - case: a-net-base-of-zero-is-refused-rather-than-passed
    intent: manual-review
    asserts: >-
      Deductions that consume the entire adjusted total leave no average annual per-student
      expenditure to compute, and the level is refused rather than reported as a threshold of
      nothing that every district clears.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1200000.00'
      elementary_capital_outlay: '100000.00'
      elementary_debt_service: '100000.00'
      elementary_part_b_expenditures: '200000.00'
      elementary_esea_title_i_a_expenditures: '200000.00'
      elementary_esea_title_iii_expenditures: '100000.00'
      elementary_state_local_sped_expenditures: '300000.00'
      elementary_state_local_esea_expenditures: '200000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '0.00'
    expect:
      status: MANUAL_REVIEW
      missingInputs: []
      output:
        levelStatus:
          ELEMENTARY: MANUAL_REVIEW
      warnings:
        - EXCESS_COST_BASE_NOT_POSITIVE
    derivation: |
      Adjusted total = 1,200,000.00 - 100,000.00 - 100,000.00      = 1,000,000.00
      Deducted = 200,000 + 200,000 + 100,000 + 300,000 + 200,000   = 1,000,000.00
      Net base                                                     =         0.00

      An average of 0.000000 gives a minimum of 0.00, which any spending clears - recurring
      failure pattern 2 in the methodology README. A district whose entire adjusted expenditure
      is categorical has a mapping error or a double count, not an excess cost obligation of
      nothing, and the platform cannot tell which from the figures.

  - case: a-single-deduction-larger-than-the-base-is-named-on-its-own
    intent: manual-review
    asserts: >-
      Where one deduction alone exceeds the adjusted total, the refusal names that line as well
      as the negative base, so a district can correct the export rather than re-deriving which
      of five figures is wrong.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1200000.00'
      elementary_capital_outlay: '100000.00'
      elementary_debt_service: '100000.00'
      elementary_part_b_expenditures: '0.00'
      elementary_esea_title_i_a_expenditures: '0.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '1200000.00'
      elementary_state_local_esea_expenditures: '0.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '0.00'
    expect:
      status: MANUAL_REVIEW
      missingInputs: []
      warnings:
        - EXCESS_COST_BASE_NOT_POSITIVE
        - EXCESS_COST_DEDUCTION_EXCEEDS
    derivation: |
      Adjusted total = 1,200,000.00 - 100,000.00 - 100,000.00      = 1,000,000.00
      State and local funds for children with disabilities alone     1,200,000.00
      Net base = 1,000,000.00 - 1,200,000.00                       =  -200,000.00

      Both refusals fire. The second is not redundant: the first says the arithmetic came out
      impossible, and the second says which of the five lines to look at first. A district told
      only that its base went negative has to re-derive the whole computation to find the
      column its ledger exported wrong.

  - case: zero-enrollment-against-positive-spending-is-refused
    intent: manual-review
    asserts: >-
      An enrolment of zero at a level where the LEA reports expenditure leaves no divisor, and
      the level is refused rather than defaulted.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 0
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '120000.00'
    expect:
      status: MANUAL_REVIEW
      missingInputs: []
      output:
        levelStatus:
          ELEMENTARY: MANUAL_REVIEW
        averagePerStudentByLevel:
          ELEMENTARY: null
      warnings:
        - EXCESS_COST_NO_ENROLLMENT
    derivation: |
      Net base 1,000,000.00 divided by an enrolment of 0.

      This is the second blocking finding recorded against the earlier specification, which
      reached the division unguarded. It is a refusal rather than a guarded default because a
      district that spent a million dollars at a level where it enrolled nobody has an
      accounting problem, and every available default - zero, infinity, skip the level - states
      something about the district that the platform does not know.

  - case: a-failure-outranks-an-unanswerable-level
    intent: fail
    asserts: >-
      A level that failed decides the requirement even where the other level could not be
      evaluated; a shortfall already established is not softened by a gap elsewhere.
    inputs:
      serves_elementary: true
      serves_secondary: true
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '90000.00'
      secondary_total_expenditures: '2000000.00'
      secondary_capital_outlay: '0.00'
      secondary_debt_service: '0.00'
      secondary_part_b_expenditures: '100000.00'
      secondary_esea_title_i_a_expenditures: '100000.00'
      secondary_esea_title_iii_expenditures: '0.00'
      secondary_state_local_sped_expenditures: '200000.00'
      secondary_state_local_esea_expenditures: '100000.00'
      secondary_children_with_disabilities: 20
      secondary_non_part_b_spend_on_children: '150000.00'
    expect:
      status: FAIL
      missingInputs:
        - secondary_enrollment_preceding_year
      output:
        levelStatus:
          ELEMENTARY: FAIL
          SECONDARY: INDETERMINATE
        shortfallByLevel:
          ELEMENTARY: '30000.00'
    derivation: |
      ELEMENTARY  minimum 120,000.00 against 90,000.00 -> FAIL, shortfall 30,000.00
      SECONDARY   enrolment absent, so no average and no threshold -> INDETERMINATE

      Roll-up: FAIL. This is the opposite of the maintenance-of-effort roll-up, where two
      failing methods and two unanswerable ones is INDETERMINATE because the four methods are
      alternatives and an unevaluated one might have qualified. Here the levels are separate
      obligations: nothing the secondary computation could have returned would undo a 30,000.00
      shortfall at elementary.

  - case: a-refusal-outranks-an-unanswerable-level
    intent: manual-review
    asserts: >-
      Where one level is refused and the other merely lacks data, the requirement reports the
      refusal, because a question the platform declined to answer is more actionable than one
      it could not reach.
    inputs:
      serves_elementary: true
      serves_secondary: true
      preceding_fiscal_year_start: '2024-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1000000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '400000.00'
      elementary_esea_title_i_a_expenditures: '400000.00'
      elementary_esea_title_iii_expenditures: '100000.00'
      elementary_state_local_sped_expenditures: '100000.00'
      elementary_state_local_esea_expenditures: '0.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '120000.00'
      secondary_total_expenditures: '2000000.00'
      secondary_capital_outlay: '0.00'
      secondary_debt_service: '0.00'
      secondary_part_b_expenditures: '100000.00'
      secondary_esea_title_i_a_expenditures: '100000.00'
      secondary_esea_title_iii_expenditures: '0.00'
      secondary_state_local_sped_expenditures: '200000.00'
      secondary_state_local_esea_expenditures: '100000.00'
      secondary_enrollment_preceding_year: 400
      secondary_non_part_b_spend_on_children: '150000.00'
    expect:
      status: MANUAL_REVIEW
      missingInputs:
        - secondary_children_with_disabilities
      output:
        levelStatus:
          ELEMENTARY: MANUAL_REVIEW
          SECONDARY: INDETERMINATE
      warnings:
        - EXCESS_COST_BASE_NOT_POSITIVE
    derivation: |
      ELEMENTARY  adjusted 1,000,000.00, deducted 400,000 + 400,000 + 100,000 + 100,000 + 0
                  = 1,000,000.00, net base 0.00 -> MANUAL_REVIEW
      SECONDARY   child count absent -> INDETERMINATE

      Roll-up rule 2 above rule 3. Both statuses mean the platform has not answered, and the
      district can act on only one of them: the refusal names a provision and a question, while
      the gap names a figure nobody has. Surfacing the refusal puts the actionable one in front
      of a reader.

  - case: a-base-year-that-is-not-the-preceding-year-is-refused
    intent: manual-review
    asserts: >-
      The expenditure base must be the year preceding the year under test, and a misaligned
      pair is refused rather than computed, because period alignment is a legal question about
      which year the regulation means.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2022-07-01'
      current_fiscal_year_start: '2025-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '130000.00'
    expect:
      status: MANUAL_REVIEW
      missingInputs: []
      warnings:
        - EXCESS_COST_PERIOD_MISALIGNED
    derivation: |
      The figures would otherwise produce a comfortable PASS: minimum 120,000.00 against
      130,000.00. That is what makes the case worth pinning - the refusal costs the district a
      clean result, and takes it anyway.

      A base three years stale understates or overstates the threshold by whatever the district's
      per-student spending has done since, and the platform has no way to tell which. Most errors
      in fiscal compliance are period alignment errors rather than arithmetic ones, and this is
      the only place the calculator can see one.

  - case: a-year-governed-by-superseded-text-is-refused
    intent: historical
    asserts: >-
      A year beginning before this rule version's effective date is not evaluated against it;
      the requirement applied then, and this calculator does not implement the text that
      governed.
    inputs:
      serves_elementary: true
      serves_secondary: false
      preceding_fiscal_year_start: '2013-07-01'
      current_fiscal_year_start: '2014-07-01'
      elementary_total_expenditures: '1500000.00'
      elementary_capital_outlay: '0.00'
      elementary_debt_service: '0.00'
      elementary_part_b_expenditures: '100000.00'
      elementary_esea_title_i_a_expenditures: '100000.00'
      elementary_esea_title_iii_expenditures: '0.00'
      elementary_state_local_sped_expenditures: '200000.00'
      elementary_state_local_esea_expenditures: '100000.00'
      elementary_enrollment_preceding_year: 250
      elementary_children_with_disabilities: 30
      elementary_non_part_b_spend_on_children: '130000.00'
    expect:
      status: MANUAL_REVIEW
      missingInputs: []
      warnings:
        - EXCESS_COST_BEFORE_EFFECTIVE_WINDOW
    derivation: |
      The rule's effective window opens 2015-07-01 and the year under test begins 2014-07-01.

      MANUAL_REVIEW rather than NOT_APPLICABLE, per ADR 0007: the excess cost requirement bound
      the LEA in 2014, so reporting that it did not apply would be false. What is true is that
      this calculator version does not implement the text in force then, which is a statement
      about the platform.
