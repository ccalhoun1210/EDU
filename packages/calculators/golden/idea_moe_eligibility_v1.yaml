      federal_funds_excluded: true
      comparison_actual_local: '10000000.00'
      comparison_actual_state_local: '15000000.00'
      comparison_child_count: 1000
      current_budget_local: '9930000.00'
      current_budget_state_local: '14940000.00'
      current_child_count: 1000
      part_b_611_allocation_current: '1480000.00'
      part_b_611_allocation_prior: '1180000.00'
      ceis_amount_300_226: '20000.00'
      esea_use_condition_attested: true
      sea_prohibition_300_205_ground: NONE
      claimed_adjustments_300_205:
        - source: LOCAL
          amount: '120000.00'
        - source: STATE_AND_LOCAL
          amount: '80000.00'
    expect:
      status: PASS
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - LOCAL_PER_CAPITA
      steps:
        adjustment_300_205_allocation_increase: '300000.00'
        adjustment_300_205_ceiling: '130000.00'
        adjustment_allowed_local: '78000.00'
        adjustment_allowed_state_local: '52000.00'
        required_local: '9922000.00'
        required_state_local: '14948000.00'
      warnings:
        - ADJUSTMENT_300_205_CAPPED
    derivation: |
      Ceiling:
        allocation increase = 1,480,000.00 - 1,180,000.00 =   300,000.00
        half the increase, rounded toward zero at the cent =  150,000.00
        less coordinated early intervening services         -  20,000.00
        ceiling                                             =  130,000.00

      Claimed under 300.205: 120,000.00 (local) + 80,000.00 (State and local) = 200,000.00,
      which exceeds the ceiling. Apportioned pro rata by claim amount:
        local            120,000.00 x 130,000.00 / 200,000.00 = 78,000.00
        State and local   80,000.00 x 130,000.00 / 200,000.00 = 52,000.00
        sum 130,000.00, exactly the ceiling, with no cent left to distribute.

      LOCAL_ONLY        required 10,000,000.00 - 78,000.00 = 9,922,000.00
                        9,930,000.00 - 9,922,000.00 = +8,000.00        -> PASS
      STATE_AND_LOCAL   required 15,000,000.00 - 52,000.00 = 14,948,000.00
                        14,940,000.00 - 14,948,000.00 = -8,000.00      -> FAIL

      Child counts are equal at 1,000, so the per-capita methods mirror the totals:
      LOCAL_PER_CAPITA PASS, STATE_AND_LOCAL_PER_CAPITA FAIL.

