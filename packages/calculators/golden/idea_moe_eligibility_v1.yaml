  - case: exception-300-205-ceiling-applies-to-the-total-and-is-apportioned-pro-rata
    intent: exception
    asserts: >-
      The 34 CFR 300.205 ceiling is applied to the total claimed under that section and
      apportioned across the claims in proportion to their amounts, so no claim is favoured
      by its position in the list.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
