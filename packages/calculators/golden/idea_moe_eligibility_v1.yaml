calculator: idea_moe_eligibility_v1
authority:
  - 34 CFR 300.203(a)
  - 34 CFR 300.203(a)(2)
  - 34 CFR 300.203(a)(3)
  - 34 CFR 300.203(c)
  - 34 CFR 300.204
  - 34 CFR 300.205
  - 34 CFR 300.226
notes: >-
  No regulatory text was retrieved when these cases were written. eCFR is unreachable from
  the authoring environment (ADR 0006), so every statement about what the regulation
  requires is an unverified paraphrase and IDEA-MOE-ELIGIBILITY-001 is held at DRAFT. The
  companion document docs/regulatory-methodology/idea-moe.md carries the input dictionary,
  the algorithm, and the open questions for legal review; read it before reading these
  cases. Three properties of this corpus are deliberate and are not defects. First, the
  calculator returns no RISK status and applies no de minimis band; a forward-looking
  signal is exposed as projectedShortfallByMethod, an output field the UI labels as a
  platform projection, never as the statutory status. Second, wherever the adversarial
  review of the draft specification found a genuine ambiguity that decides a case, the
  expected status is MANUAL_REVIEW with a blocking warning naming the provision and the
  open question - the calculator does not pick an answer. Third, an absent input that
  could not have changed the answer does not make a result indeterminate; it is reported
  in dataGapsObserved instead of in missingInputs, which the calculator contract reserves
  for inputs the result actually depended on. Every figure below is synthetic.

cases:
  - case: pass-all-four-methods-with-no-reduction-claimed
    intent: pass
    asserts: >-
      An LEA that budgets more than the comparison year's actual expenditure under every
      permitted method satisfies the eligibility standard, and each per-capita method is
      decided by cross-multiplication rather than by comparing rounded quotients.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0001
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1024
      current_budget_local: '12650000.00'
      current_budget_state_local: '19050000.00'
      current_child_count: 1010
    expect:
      status: PASS
      missingInputs: []
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - STATE_AND_LOCAL
          - LOCAL_PER_CAPITA
          - STATE_AND_LOCAL_PER_CAPITA
        comparisonYear:
          fiscalYearStart: '2025-07-01'
          basis: ACTUAL_EXPENDITURE
          selectionAuthority: 34 CFR 300.203(a)(1)
        marginByMethod:
          LOCAL_ONLY: '250000.00'
          STATE_AND_LOCAL: '150000.00'
      steps:
        required_local: '12400000.00'
        required_state_local: '18900000.00'
        comparison_local_per_capita: '12109.375000'
        budget_local_per_capita: '12524.752475'
        comparison_state_local_per_capita: '18457.031250'
        budget_state_local_per_capita: '18861.386139'
    derivation: |
      No reduction is claimed, so required = comparison amount under every method.

      LOCAL_ONLY        12,650,000.00 - 12,400,000.00 = +250,000.00  -> PASS
      STATE_AND_LOCAL   19,050,000.00 - 18,900,000.00 = +150,000.00  -> PASS

      LOCAL_PER_CAPITA, decided by cross-multiplication (no division):
        budget side   12,650,000.00 x 1,024 = 12,953,600,000.00
        required side 12,400,000.00 x 1,010 = 12,524,000,000.00
        12,953,600,000.00 >= 12,524,000,000.00                      -> PASS
        Displayed quotients only: 12,400,000.00 / 1,024 = 12,109.375 exactly;
        12,650,000.00 / 1,010 = 12,524.752475247... -> 12,524.752475 at 6 dp HALF_UP.

      STATE_AND_LOCAL_PER_CAPITA:
        budget side   19,050,000.00 x 1,024 = 19,507,200,000.00
        required side 18,900,000.00 x 1,010 = 19,089,000,000.00
        19,507,200,000.00 >= 19,089,000,000.00                      -> PASS
        Displayed: 18,900,000.00 / 1,024 = 18,457.03125 exactly;
        19,050,000.00 / 1,010 = 18,861.3861386138... -> 18,861.386139 at 6 dp HALF_UP.

  - case: manual-review-budget-year-precedes-the-text-this-version-implements
    intent: manual-review
    asserts: >-
      A budget year earlier than the text this calculator version implements is routed to
      review, never reported as not applicable, because the maintenance-of-effort
      requirement did apply to that year under the prior text.
    inputs:
      current_fiscal_year_start: '2014-07-01'
      most_recent_available_fiscal_year_start: '2012-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2012-0001
      comparison_fiscal_year_start: '2012-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '9000000.00'
      comparison_actual_state_local: '14000000.00'
      comparison_child_count: 900
      current_budget_local: '9500000.00'
      current_budget_state_local: '14500000.00'
      current_child_count: 900
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
      warnings:
        - OUTSIDE_RULE_EFFECTIVE_WINDOW
    derivation: |
      The arithmetic would qualify on all four methods (9,500,000.00 >= 9,000,000.00 and
      14,500,000.00 >= 14,000,000.00, child counts equal so the per-capita methods mirror
      the totals). None of it is performed.

      Budget FY start 2014-07-01 precedes the effective start of the text this version
      implements. NOT_APPLICABLE would tell the LEA it had no obligation for that year,
      which is false; the obligation existed under the earlier text, which this version
      does not implement. The refusal names the version gap, not an exemption.

  - case: fail-under-all-four-methods
    intent: fail
    asserts: >-
      An LEA whose budget falls below the comparison-year level under every permitted
      method fails the eligibility standard, and the projected shortfall is reported as a
      platform figure rather than as a status band.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0002
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1031
      current_budget_local: '12000000.00'
      current_budget_state_local: '18300000.00'
      current_child_count: 1002
    expect:
      status: FAIL
      missingInputs: []
      output:
        qualifyingMethods: []
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: FAIL
          STATE_AND_LOCAL_PER_CAPITA: FAIL
        marginByMethod:
          LOCAL_ONLY: '-400000.00'
          STATE_AND_LOCAL: '-600000.00'
        projectedShortfallByMethod:
          LOCAL_ONLY: '400000.00'
          STATE_AND_LOCAL: '600000.00'
      steps:
        required_local: '12400000.00'
        required_state_local: '18900000.00'
    derivation: |
      LOCAL_ONLY        12,000,000.00 - 12,400,000.00 = -400,000.00  -> FAIL
      STATE_AND_LOCAL   18,300,000.00 - 18,900,000.00 = -600,000.00  -> FAIL

      LOCAL_PER_CAPITA cross-multiplied:
        12,000,000.00 x 1,031 = 12,372,000,000.00
        12,400,000.00 x 1,002 = 12,424,800,000.00
        12,372,000,000.00 < 12,424,800,000.00                        -> FAIL

      STATE_AND_LOCAL_PER_CAPITA cross-multiplied:
        18,300,000.00 x 1,031 = 18,867,300,000.00
        18,900,000.00 x 1,002 = 18,937,800,000.00
        18,867,300,000.00 < 18,937,800,000.00                        -> FAIL

      No reduction carries timing EXPECTED_BUDGET_YEAR, so the projected shortfall for a
      total method equals its current shortfall: 400,000.00 and 600,000.00.
      Per-capita projections are per child and are not asserted here; the derivation of
      the local per-capita figure is
      12,400,000.00 / 1,031 - 12,000,000.00 / 1,002 = 51.110194741... -> 51.110195.

  - case: boundary-exact-equality-passes-and-one-cent-short-fails
    intent: boundary
    asserts: >-
      Budgeting to the penny what was spent satisfies the at-least test, and there is no de
      minimis tolerance below it.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0003
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1024
      current_budget_local: '12400000.00'
      current_budget_state_local: '18899999.99'
      current_child_count: 1024
    expect:
      status: PASS
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - LOCAL_PER_CAPITA
        methodStatus:
          LOCAL_ONLY: PASS
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: PASS
          STATE_AND_LOCAL_PER_CAPITA: FAIL
        marginByMethod:
          LOCAL_ONLY: '0.00'
          STATE_AND_LOCAL: '-0.01'
    derivation: |
      Child counts are equal at 1,024, so each per-capita method mirrors its total method.

      LOCAL_ONLY        12,400,000.00 - 12,400,000.00 =  0.00        -> PASS
      STATE_AND_LOCAL   18,899,999.99 - 18,900,000.00 = -0.01        -> FAIL

      LOCAL_PER_CAPITA cross-multiplied:
        12,400,000.00 x 1,024 = 12,697,600,000.00 on both sides      -> PASS

      STATE_AND_LOCAL_PER_CAPITA cross-multiplied:
        18,899,999.99 x 1,024 = 19,353,599,989.76
        18,900,000.00 x 1,024 = 19,353,600,000.00
        19,353,599,989.76 < 19,353,600,000.00                        -> FAIL

      One qualifying method is sufficient, so the run is PASS. The one-cent shortfall on
      the State-and-local measure is still reported on that method.

  - case: boundary-per-capita-equality-at-a-repeating-quotient
    intent: boundary
    asserts: >-
      Two per-capita levels that are exactly equal but non-terminating as decimals satisfy
      the test; the equality is established by cross-multiplication, which no rounding of
      the quotients could reproduce reliably.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0004
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '7600000.00'
      comparison_child_count: 1050
      current_budget_local: '4800000.00'
      current_budget_state_local: '7200000.00'
      current_child_count: 1008
    expect:
      status: PASS
      output:
        qualifyingMethods:
          - LOCAL_PER_CAPITA
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: PASS
          STATE_AND_LOCAL_PER_CAPITA: FAIL
      steps:
        comparison_local_per_capita: '4761.904762'
        budget_local_per_capita: '4761.904762'
    derivation: |
      LOCAL_ONLY        4,800,000.00 - 5,000,000.00 = -200,000.00    -> FAIL
      STATE_AND_LOCAL   7,200,000.00 - 7,600,000.00 = -400,000.00    -> FAIL

      LOCAL_PER_CAPITA cross-multiplied:
        4,800,000.00 x 1,050 = 5,040,000,000.00
        5,000,000.00 x 1,008 = 5,040,000,000.00
        equal                                                        -> PASS
        Both quotients are 4,761.904761904761... which rounds to 4,761.904762 at 6 dp.
        The displayed values agreeing is a coincidence of this case, not the test: the
        decision never touches them.

      STATE_AND_LOCAL_PER_CAPITA cross-multiplied:
        7,200,000.00 x 1,050 = 7,560,000,000.00
        7,600,000.00 x 1,008 = 7,660,800,000.00
        7,560,000,000.00 < 7,660,800,000.00                          -> FAIL

  - case: missing-comparison-child-count-cannot-produce-a-failure
    intent: missing-data
    asserts: >-
      A gap that disables only the per-capita methods leaves the year unanswerable rather
      than failed, because an unevaluated method might have qualified.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0005
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      current_budget_local: '12000000.00'
      current_budget_state_local: '18300000.00'
      current_child_count: 1002
    expect:
      status: INDETERMINATE
      missingInputs:
        - comparison_child_count
      output:
        qualifyingMethods: []
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: INDETERMINATE
          STATE_AND_LOCAL_PER_CAPITA: INDETERMINATE
    derivation: |
      LOCAL_ONLY        12,000,000.00 - 12,400,000.00 = -400,000.00  -> FAIL
      STATE_AND_LOCAL   18,300,000.00 - 18,900,000.00 = -600,000.00  -> FAIL
      Both per-capita methods need the comparison-year child count for their required
      side; it is absent, so neither can be evaluated.

      Two failures plus two unanswerable methods is not a failure of the standard: the
      standard is satisfied by any one method, and two of them were never run. The result
      the district owes is the missing count, not a finding.

  - case: missing-state-and-local-figures-do-not-defeat-a-qualifying-method
    intent: missing-data
    asserts: >-
      An absent input that could not have changed the answer is reported as an observed
      data gap, not as a missing input, because the calculator contract reserves
      missingInputs for inputs the result depended on.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0006
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_child_count: 1024
      current_budget_local: '12650000.00'
      current_child_count: 1010
    expect:
      status: PASS
      missingInputs: []
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - LOCAL_PER_CAPITA
        methodStatus:
          LOCAL_ONLY: PASS
          STATE_AND_LOCAL: INDETERMINATE
          LOCAL_PER_CAPITA: PASS
          STATE_AND_LOCAL_PER_CAPITA: INDETERMINATE
        dataGapsObserved:
          - comparison_actual_state_local
          - current_budget_state_local
    derivation: |
      LOCAL_ONLY        12,650,000.00 - 12,400,000.00 = +250,000.00  -> PASS
      LOCAL_PER_CAPITA  12,650,000.00 x 1,024 = 12,953,600,000.00
                        12,400,000.00 x 1,010 = 12,524,000,000.00    -> PASS

      Neither State-and-local figure is present, so those two methods are unanswerable.
      Satisfying one method is sufficient, and no value of the absent figures could have
      unmade a qualifying method, so the result did not depend on them: missingInputs is
      empty and the two gaps are reported in dataGapsObserved for the administrator.

  - case: manual-review-claimed-exception-names-no-enumerated-ground
    intent: manual-review
    asserts: >-
      A claimed reduction that does not name one of the enumerated 34 CFR 300.204 grounds
      is a validation failure, not a silently ignored claim, even where the LEA would
      qualify without it.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0007
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1000
      current_budget_local: '12650000.00'
      current_budget_state_local: '19050000.00'
      current_child_count: 1000
      claimed_exceptions:
        - ground: GENERAL_BUDGET_REDUCTION
          source: LOCAL
          amount: '250000.00'
          timing: TAKEN_INTERVENING
          event_fiscal_year_start: '2026-07-01'
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
      warnings:
        - UNRECOGNISED_EXCEPTION_GROUND
    derivation: |
      Without the claim the LEA qualifies on all four methods
      (12,650,000.00 >= 12,400,000.00 and 19,050,000.00 >= 18,900,000.00, equal child
      counts). The calculator does not reach that arithmetic.

      GENERAL_BUDGET_REDUCTION is not one of the five enumerated grounds. Admitting it
      silently would let the platform report a status on a submission whose premise it
      cannot read; ignoring it silently would report a PASS while the LEA believes it is
      relying on a 250,000.00 reduction the platform discarded. Both are refused.

  - case: manual-review-claimed-reduction-equals-the-comparison-amount
    intent: manual-review
    asserts: >-
      Total claimed reductions at or above the comparison-year amount refuse the whole run;
      a required level of zero is never a pass, and an untouched qualifying method does not
      cure the defect.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0008
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1000
      current_budget_local: '500000.00'
      current_budget_state_local: '19100000.00'
      current_child_count: 1000
      claimed_exceptions:
        - ground: TERMINATION_OF_LONG_TERM_PURCHASE
          source: LOCAL
          amount: '12400000.00'
          timing: TAKEN_INTERVENING
          event_fiscal_year_start: '2026-07-01'
          evidence_ref: EV-204D-0009
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
      warnings:
        - REDUCTION_NOT_LESS_THAN_COMPARISON_AMOUNT
    derivation: |
      Claimed reduction against local funds = 12,400,000.00.
      Comparison-year local amount          = 12,400,000.00.
      Clamping the required level to 0.00 would make 500,000.00 - a budget five percent of
      last year's - a PASS on the local-only and local per-capita methods.

      The State-and-local measure would qualify on its own
      (19,100,000.00 >= 18,900,000.00). The refusal is still whole-run: a claim that
      consumes an entire comparison-year measure is a data-integrity event that puts the
      whole submission in question, and a blocking warning may not accompany a PASS.

  - case: manual-review-amounts-not-stated-net-of-federal-funds
    intent: manual-review
    asserts: >-
      Where the LEA has not attested that federally accountable expenditures are excluded,
      the amounts are not on the statutory basis and no arithmetic on them is meaningful.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0010
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: false
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1000
      current_budget_local: '12650000.00'
      current_budget_state_local: '19050000.00'
      current_child_count: 1000
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
      warnings:
        - FEDERAL_FUNDS_NOT_EXCLUDED
    derivation: |
      Every figure would qualify. None is evaluated.

      The attestation is present and false, which is a known-bad input rather than a gap:
      the amounts include expenditures the LEA or SEA must account for federally, so they
      are not the quantities the eligibility standard speaks about. INDETERMINATE would
      misdescribe the problem as a missing figure; the figures arrived, on the wrong basis.

  - case: exception-300-204-reduces-the-required-level-and-secures-a-pass
    intent: exception
    asserts: >-
      An evidenced reduction on an enumerated 34 CFR 300.204 ground lowers the required
      level for the methods it is claimed against, and one qualifying method is sufficient.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0011
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1000
      current_budget_local: '12250000.00'
      current_budget_state_local: '18800000.00'
      current_child_count: 1000
      claimed_exceptions:
        - ground: TERMINATION_OF_LONG_TERM_PURCHASE
          source: LOCAL
          amount: '200000.00'
          timing: TAKEN_INTERVENING
          event_fiscal_year_start: '2026-07-01'
          evidence_ref: EV-204D-0011
    expect:
      status: PASS
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - LOCAL_PER_CAPITA
        marginByMethod:
          LOCAL_ONLY: '50000.00'
          STATE_AND_LOCAL: '-100000.00'
      steps:
        reduction_local: '200000.00'
        reduction_state_local: '0.00'
        required_local: '12200000.00'
        required_state_local: '18900000.00'
    derivation: |
      Reduction against local funds     = 200,000.00 (one 300.204(d) entry)
      Reduction against State and local = 0.00 (no entry with that source)

      LOCAL_ONLY        required 12,400,000.00 - 200,000.00 = 12,200,000.00
                        12,250,000.00 - 12,200,000.00 = +50,000.00     -> PASS
      STATE_AND_LOCAL   required 18,900,000.00
                        18,800,000.00 - 18,900,000.00 = -100,000.00    -> FAIL

      Child counts are equal at 1,000, so the two readings of how a reduction enters a
      per-capita method coincide and no dispute arises:
      LOCAL_PER_CAPITA  12,250,000.00 x 1,000 = 12,250,000,000.00
                        12,200,000.00 x 1,000 = 12,200,000,000.00      -> PASS
      STATE_AND_LOCAL_PER_CAPITA
                        18,800,000.00 x 1,000 = 18,800,000,000.00
                        18,900,000.00 x 1,000 = 18,900,000,000.00      -> FAIL

  - case: manual-review-per-capita-reduction-basis-decides-the-method
    intent: manual-review
    asserts: >-
      Where the two readings of how a 34 CFR 300.204 reduction enters a per-capita method
      give different answers, the calculator refuses that method rather than choosing one.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0012
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '10000000.00'
      comparison_actual_state_local: '15000000.00'
      comparison_child_count: 1000
      current_budget_local: '7600000.00'
      current_budget_state_local: '11000000.00'
      current_child_count: 800
      claimed_exceptions:
        - ground: TERMINATION_OF_LONG_TERM_PURCHASE
          source: LOCAL
          amount: '400000.00'
          timing: TAKEN_INTERVENING
          event_fiscal_year_start: '2026-07-01'
          evidence_ref: EV-204D-0012
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: MANUAL_REVIEW
          STATE_AND_LOCAL_PER_CAPITA: FAIL
      warnings:
        - PER_CAPITA_REDUCTION_BASIS_DISPUTED
    derivation: |
      LOCAL_ONLY        required 10,000,000.00 - 400,000.00 = 9,600,000.00
                        7,600,000.00 - 9,600,000.00 = -2,000,000.00    -> FAIL
      STATE_AND_LOCAL   15,000,000.00 required; 11,000,000.00 budgeted -> FAIL
      STATE_AND_LOCAL_PER_CAPITA (no reduction on that source, so the readings coincide):
                        11,000,000.00 x 1,000 = 11,000,000,000.00
                        15,000,000.00 x   800 = 12,000,000,000.00      -> FAIL

      LOCAL_PER_CAPITA, the two readings:
        Reading A - the reduction is a budget-year event spread over budget-year children:
          required per child = 10,000,000.00/1,000 - 400,000.00/800 = 10,000 - 500 = 9,500
          cross form: (7,600,000.00 + 400,000.00) x 1,000 = 8,000,000,000.00
                       10,000,000.00 x 800                = 8,000,000,000.00
          equal                                                        -> PASS
        Reading B - the reduction comes off the comparison-year numerator:
          required per child = (10,000,000.00 - 400,000.00)/1,000 = 9,600
          cross form: 7,600,000.00 x 1,000 = 7,600,000,000.00
                       9,600,000.00 x   800 = 7,680,000,000.00
          7,600,000,000.00 < 7,680,000,000.00                          -> FAIL

      The readings agree only when the child counts are equal; here 1,000 against 800 puts
      the budgeted level exactly on reading A's boundary and below reading B's. Which
      reading the regulation requires is unresolved, so the method is refused. No method
      qualifies and one is refused, so the run is refused.

