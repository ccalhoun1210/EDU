  - case: manual-review-comparison-basis-inconsistent-with-a-prior-year-failure
    intent: manual-review
    asserts: >-
      After a failure the comparison basis must be the level that would have been required
      absent the failure; the calculator refuses a declared basis that would let the LEA
      measure against its own reduced level.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: NOT_MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0019
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '11700000.00'
      comparison_actual_state_local: '17800000.00'
      comparison_child_count: 1031
      current_budget_local: '12000000.00'
      current_budget_state_local: '18300000.00'
      current_child_count: 1002
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
      warnings:
        - COMPARISON_BASIS_INCONSISTENT
    derivation: |
      Against the failure year's own actuals the LEA would appear to qualify on the
      local-only measure by 12,000,000.00 - 11,700,000.00 = +300,000.00. That comparison is
      not available to it: the declared prior-year status is NOT_MET, and a basis of
      ACTUAL_EXPENDITURE would carry the reduced level forward as the bar - the ratchet-down
      the subsequent-years rule exists to prevent.

      The two declared facts contradict each other. Selecting the correct basis requires
      reading prior finalized runs, which a pure calculator may not do, so the calculator
      validates the declaration and refuses when it does not hold together.

  - case: subsequent-year-uses-the-declared-required-level-not-the-failure-year-actual
    intent: fail
    asserts: >-
      After a failure the level carried forward is the declared required level, a distinct
      input from the failure year's actual expenditure, and the calculator uses the
      declared level.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: NOT_MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0020
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: REQUIRED_LEVEL_AFTER_FAILURE
      federal_funds_excluded: true
      comparison_actual_local: '11700000.00'
      comparison_actual_state_local: '17800000.00'
      comparison_child_count: 1015
      comparison_required_level_local: '12400000.00'
      comparison_required_level_state_local: '18900000.00'
      comparison_required_level_child_count: 1031
      current_budget_local: '12000000.00'
      current_budget_state_local: '18300000.00'
      current_child_count: 1002
    expect:
      status: FAIL
      missingInputs: []
      output:
        qualifyingMethods: []
        comparisonYear:
          basis: REQUIRED_LEVEL_AFTER_FAILURE
          selectionAuthority: 34 CFR 300.203(c)
        marginByMethod:
          LOCAL_ONLY: '-400000.00'
          STATE_AND_LOCAL: '-600000.00'
      steps:
        comparison_amount_local: '12400000.00'
        comparison_amount_state_local: '18900000.00'
        required_local: '12400000.00'
    derivation: |
      Both the failure year's actuals (11,700,000.00 and 17,800,000.00) and the declared
      required levels (12,400,000.00 and 18,900,000.00) are supplied. Under the declared
      basis the calculator reads the required levels; the actuals are carried in the step
      list for the reviewer but take no part in the arithmetic, which is the point of
      modelling them as separate inputs rather than overloading one pair of names.

      LOCAL_ONLY        12,000,000.00 - 12,400,000.00 = -400,000.00     -> FAIL
      STATE_AND_LOCAL   18,300,000.00 - 18,900,000.00 = -600,000.00     -> FAIL

      The per-capita methods pair the declared level with its own declared child count,
      1,031, again a separate input from comparison_child_count:
      LOCAL_PER_CAPITA  12,000,000.00 x 1,031 = 12,372,000,000.00
                        12,400,000.00 x 1,002 = 12,424,800,000.00       -> FAIL
      STATE_AND_LOCAL_PER_CAPITA
                        18,300,000.00 x 1,031 = 18,867,300,000.00
                        18,900,000.00 x 1,002 = 18,937,800,000.00       -> FAIL

      Which fiscal year's child count belongs with a reconstructed required level is an
      open question; the calculator does not infer it, it consumes the declaration.

  - case: not-applicable-zero-comparison-child-count-is-not-a-zero-requirement
    intent: not-applicable
    asserts: >-
      A per-capita method whose denominator is zero is not applicable for that method; a
      zero denominator is never treated as a zero requirement.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: MET
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2025-0021
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '10000000.00'
      comparison_actual_state_local: '15000000.00'
      comparison_child_count: 0
      current_budget_local: '9500000.00'
      current_budget_state_local: '14500000.00'
      current_child_count: 1000
    expect:
      status: FAIL
      missingInputs: []
      output:
        qualifyingMethods: []
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: NOT_APPLICABLE
          STATE_AND_LOCAL_PER_CAPITA: NOT_APPLICABLE
      warnings:
        - ZERO_COMPARISON_CHILD_COUNT
    derivation: |
      LOCAL_ONLY        9,500,000.00 - 10,000,000.00 = -500,000.00      -> FAIL
      STATE_AND_LOCAL   14,500,000.00 - 15,000,000.00 = -500,000.00     -> FAIL

      The comparison-year child count is zero, so no comparison-year per-capita level
      exists. Cross-multiplication would compare 9,500,000.00 x 0 = 0 against
      10,000,000.00 x 1,000 and, with the operands the other way round, would report a
      requirement of zero that any budget clears. Neither is a determination about the
      LEA, so both per-capita methods are not applicable.

      Both computable methods were evaluated and both failed, and no method is
      unanswerable for want of data, so the run is FAIL rather than INDETERMINATE.

  - case: manual-review-prior-year-moe-status-unknown
    intent: manual-review
    asserts: >-
      An unknown prior-year maintenance-of-effort status leaves the comparison basis
      undetermined; the field was supplied, so the refusal names a remedy rather than
      reporting the field as missing.
    inputs:
      current_fiscal_year_start: '2027-07-01'
      most_recent_available_fiscal_year_start: '2025-07-01'
      most_recent_available_year_moe_status: UNKNOWN
      comparison_fiscal_year_start: '2025-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      federal_funds_excluded: true
      comparison_actual_local: '12400000.00'
      comparison_actual_state_local: '18900000.00'
      comparison_child_count: 1000
      current_budget_local: '12650000.00'
      current_budget_state_local: '19050000.00'
      current_child_count: 1000
    expect:
      status: MANUAL_REVIEW
      missingInputs: []
      output:
        qualifyingMethods: []
      warnings:
        - COMPARISON_YEAR_MOE_STATUS_UNKNOWN
    derivation: |
      Every amount needed is present and would qualify on all four methods. Whether they
      are the right amounts depends on whether the most recent available year was a
      failure, which is exactly what UNKNOWN declines to say.

      The status input arrived with a value, so listing it in missingInputs would tell the
      district to supply a field it already supplied, and would make two different
      situations - the field absent from the extract, and no finalized compliance run
      existing for that year - indistinguishable. The warning names the remedy: a finalized
      idea_moe_compliance_v1 run for that fiscal year, or an SEA determination of record.
