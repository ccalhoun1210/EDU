        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0012
      comparison_actual_local: '10000000.00'
      comparison_actual_state_local: '15000000.00'
      comparison_child_count: 1000
      claimed_exceptions:
        - ground: TERMINATION_OF_LONG_TERM_PURCHASE
          source: LOCAL
          amount: '400000.00'
          basis_description: A completed accessible-transport vehicle purchase was not repeated.
          event_fiscal_year_start: '2025-07-01'
          evidence_ref: EV-204D-0012
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: MANUAL_REVIEW
          STATE_AND_LOCAL_PER_CAPITA: FAIL
        repaymentExposureBounds: null
      warnings:
        - PER_CAPITA_REDUCTION_BASIS_DISPUTED
    derivation: |
      LOCAL_ONLY        required 10,000,000.00 - 400,000.00 = 9,600,000.00
                        7,600,000.00 - 9,600,000.00 = -2,000,000.00     -> FAIL
      STATE_AND_LOCAL   15,000,000.00 required; 11,000,000.00 spent     -> FAIL
      STATE_AND_LOCAL_PER_CAPITA (no reduction on that source, readings coincide):
                        11,000,000.00 x 1,000 = 11,000,000,000.00
                        15,000,000.00 x   800 = 12,000,000,000.00       -> FAIL

      LOCAL_PER_CAPITA, the two readings:
        A - reduction is a current-year event spread over current-year children:
            required per child = 10,000,000.00/1,000 - 400,000.00/800 = 9,500
            cross form (7,600,000.00 + 400,000.00) x 1,000 = 8,000,000,000.00
                        10,000,000.00 x 800                = 8,000,000,000.00
            equal, and equality satisfies the standard                  -> PASS
        B - reduction comes off the comparison-year numerator:
            required per child = (10,000,000.00 - 400,000.00)/1,000 = 9,600
            cross form 7,600,000.00 x 1,000 = 7,600,000,000.00
                        9,600,000.00 x   800 = 7,680,000,000.00         -> FAIL

      Three methods failed. Reading B would make it four and produce a repayment; reading A
      would make the year compliant. The calculator will not pick, so the run is refused and
      the district's file goes to a person with the two computations in front of them.

