        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0014
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
      part_b_611_allocation_current: '1480000.00'
      part_b_611_allocation_prior: '1180000.00'
      ceis_amount_300_226: '0.00'
      esea_use_condition_attested: true
      sea_prohibition_300_205_ground: NONE
      claimed_exceptions:
        - ground: HIGH_COST_FUND_ASSUMPTION
          source: LOCAL
          amount: '150000.00'
          basis_description: The State high cost fund assumed part of one placement's cost.
          event_fiscal_year_start: '2025-07-01'
          evidence_ref: EV-204E-0014
      claimed_adjustments_300_205:
        - source: LOCAL
          amount: '160000.00'
    expect:
      status: PASS
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - LOCAL_PER_CAPITA
        marginByMethod:
          LOCAL_ONLY: '0.00'
      steps:
        adjustment_300_205_allocation_increase: '300000.00'
        adjustment_300_205_ceiling: '150000.00'
        adjustment_allowed_local: '150000.00'
        exception_total_local: '150000.00'
        reduction_local: '300000.00'
        required_local: '4700000.00'
      warnings:
        - ADJUSTMENT_300_205_CAPPED
    derivation: |
      Ceiling under 300.205:
        allocation increase = 1,480,000.00 - 1,180,000.00 = 300,000.00
        half the increase, rounded toward zero at the cent = 150,000.00
        less coordinated early intervening services of 0.00
        ceiling = 150,000.00
      The claim of 160,000.00 exceeds it and is allowed at 150,000.00. The ceiling is a
      maximum, so a claim over it is reduced rather than reproduced.

      Reduction against local funds = 150,000.00 (300.204(e)) + 150,000.00 (300.205)
                                    = 300,000.00
      LOCAL_ONLY        required 5,000,000.00 - 300,000.00 = 4,700,000.00
                        4,700,000.00 - 4,700,000.00 = 0.00              -> PASS
      STATE_AND_LOCAL   8,000,000.00 required; 7,900,000.00 spent       -> FAIL
      Child counts equal at 1,000, so the per-capita methods follow the totals.

      Whether the two authorities stack additively or sequence is raised as an open
      question. On these facts the readings coincide: both are subtractions from the same
      required level, and the 300.205 ceiling has its own independent base - half the
      section 611 increase - so applying the exception first does not change the ceiling.
      Where a future reading makes the ceiling depend on the post-exception level the
      answers would diverge and this path would have to be refused.

  - case: manual-review-comparison-year-met-under-only-some-methods
    intent: manual-review
    asserts: >-
