        - STATE_AND_LOCAL
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0015
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
        methodStatus:
          LOCAL_ONLY: MANUAL_REVIEW
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: MANUAL_REVIEW
          STATE_AND_LOCAL_PER_CAPITA: FAIL
        repaymentExposureBounds: null
      warnings:
        - COMPARISON_BASIS_READING_DISPUTED
    derivation: |
      The LEA met the standard in the comparison year, under the State-and-local measures
      only. Two readings of the subsequent-years rule follow.

      Reading 1 - the rule turns on the standard as a whole. The comparison year was not a
      failure, so there is nothing to carry forward and every method measures against that
      year's actuals: local required 5,000,000.00, State and local 8,000,000.00.
      Reading 2 - the rule turns on each method. The local measures were not met in the
      comparison year, so their bar is the level that would have been required then, which
      is at least the comparison year's actual and is not supplied.

      STATE_AND_LOCAL   7,900,000.00 - 8,000,000.00 = -100,000.00       -> FAIL under both
      STATE_AND_LOCAL_PER_CAPITA, counts equal, follows it              -> FAIL under both
      LOCAL_ONLY and LOCAL_PER_CAPITA: reading 1 gives a 100,000.00 shortfall and a fourth
      failure; reading 2 gives no level at all and no determination. The difference decides
      whether this district owes a repayment, so both local methods are refused.

