      whole is unresolved; where the two readings can differ for a method, that method is
      refused rather than measured against a level one reading forbids.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
