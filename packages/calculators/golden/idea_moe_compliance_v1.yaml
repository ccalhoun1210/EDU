      quantities. Measured against the actuals the LEA would appear to have increased
      effort by 300,000.00 on local funds; that comparison is not available to it.

      LOCAL_ONLY        5,000,000.00 - 4,700,000.00 = 300,000.00 short  -> FAIL
      STATE_AND_LOCAL   8,000,000.00 - 7,600,000.00 = 400,000.00 short  -> FAIL
