        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0020
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
      claimed_exceptions:
        - ground: VOLUNTARY_DEPARTURE_OF_PERSONNEL
          source: LOCAL
          amount: '60000.00'
          personnel_departure_type: VOLUNTARY
          basis_description: A speech-language pathologist resigned and was not replaced until spring.
          event_fiscal_year_start: '2025-07-01'
        - ground: TERMINATION_OF_LONG_TERM_PURCHASE
          source: LOCAL
          amount: '55000.00'
          basis_description: A completed assistive-technology refresh was not repeated.
          event_fiscal_year_start: '2025-07-01'
