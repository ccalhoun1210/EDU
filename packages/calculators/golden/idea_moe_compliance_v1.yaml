      Neither claim carries an evidence reference, so both are unverified.

      LOCAL_ONLY        required 5,000,000.00 - (60,000.00 + 55,000.00) = 4,885,000.00
                        4,950,000.00 - 4,885,000.00 = +65,000.00        -> PASS
