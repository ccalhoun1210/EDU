          - LOCAL_ONLY
          - LOCAL_PER_CAPITA
        qualifyingMethodsDependOnUnverifiedClaims: false
      steps:
        reduction_local: '207000.00'
        reduction_state_local: '0.00'
        required_local: '4793000.00'
        required_state_local: '8000000.00'
    derivation: |
      Reduction against local funds     = 207,000.00
      Reduction against State and local = 0.00 (the LEA did not claim against that measure)

      LOCAL_ONLY        required 5,000,000.00 - 207,000.00 = 4,793,000.00
                        4,850,000.00 - 4,793,000.00 = +57,000.00        -> PASS
      STATE_AND_LOCAL   7,900,000.00 - 8,000,000.00 = -100,000.00       -> FAIL

      Child counts are equal at 1,000, so the two readings of how a reduction enters a
      per-capita method coincide and LOCAL_PER_CAPITA takes LOCAL_ONLY's disposition.

      The claim carries an evidence reference, so it is verified and the qualification does
      not depend on an unevidenced assertion.

  - case: manual-review-per-capita-reduction-basis-decides-the-method
    intent: manual-review
    asserts: >-
      Where spreading a reduction over the current year's children and taking it off the
      comparison year's numerator give different answers, the calculator refuses that
      method rather than choosing, so no repayment is asserted on an unresolved reading.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '7600000.00'
      current_actual_state_local: '11000000.00'
