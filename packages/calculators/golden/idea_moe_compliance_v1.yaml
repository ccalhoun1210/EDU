      Child counts equal at 1,000, so LOCAL_PER_CAPITA follows LOCAL_ONLY.

      Materiality tested one claim at a time would find nothing:
        remove the 60,000.00 claim -> required 4,945,000.00, margin +5,000.00  PASS
        remove the 55,000.00 claim -> required 4,940,000.00, margin +10,000.00 PASS
      Tested over the set, which is the honest test:
        remove both -> required 5,000,000.00, margin -50,000.00                FAIL

      The qualification therefore rests on the two unevidenced claims taken together. That
      is reported as a flag and as the 50,000.00 shortfall the year would show if they were
      disallowed. It is not a status: the statute sets no band between compliance and
      failure, and inventing one would let the platform tell a district it half-failed a
      test the regulation states as a single line.
