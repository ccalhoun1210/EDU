calculator: idea_moe_compliance_v1
authority:
  - 34 CFR 300.203(b)
  - 34 CFR 300.203(a)(3)
  - 34 CFR 300.203(c)
  - 34 CFR 300.203(d)
  - 34 CFR 300.204
  - 34 CFR 300.205
  - 34 CFR 300.226
  - 34 CFR 300.704(c)
  - 20 U.S.C. 1413(a)(2)
notes: >-
  No regulatory text was retrieved when these cases were written. eCFR is unreachable from
  the authoring environment (ADR 0006), so every statement about what the regulation
  requires is an unverified paraphrase and IDEA-MOE-COMPLIANCE-001 is held at DRAFT. Read
  docs/regulatory-methodology/idea-moe.md first; it carries the input dictionary, the
  algorithm, and the open questions for legal review. Four properties are deliberate.
  First, a failure here carries a repayment obligation, so the corpus never lets a FAIL
  issue on an incomplete calculation - two failing methods and two unanswerable ones is
  INDETERMINATE. Second, which method's shortfall fixes the repayment amount is
  unresolved, so the calculator reports a bounded range and never a single figure; the
  status is unaffected. Third, there is no RISK status and no de minimis band: a
  qualification that rests on unevidenced claims is reported as a named output field
  computed over the whole set of unverified claims, not one claim at a time. Fourth,
  wherever the adversarial review found a genuine ambiguity that decides a case, the
  expected status is MANUAL_REVIEW with a blocking warning naming the provision and the
  open question. Every figure below is synthetic.

cases:
  - case: pass-on-the-state-and-local-methods-while-the-local-methods-fall-short
    intent: pass
    asserts: >-
      Not reducing expenditure below the comparison level under any one of the four
      permitted methods satisfies the compliance standard; a shortfall under another method
      is not a failure and carries no repayment.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '4900000.00'
      current_actual_state_local: '8100000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0001
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
    expect:
      status: PASS
      missingInputs: []
      output:
        qualifyingMethods:
          - STATE_AND_LOCAL
          - STATE_AND_LOCAL_PER_CAPITA
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: PASS
          LOCAL_PER_CAPITA: FAIL
          STATE_AND_LOCAL_PER_CAPITA: PASS
        repaymentExposureBounds: null
      steps:
        required_local: '5000000.00'
        required_state_local: '8000000.00'
    derivation: |
      No reduction is claimed, so required = comparison amount under every method, and the
      child counts are equal at 1,000, so each per-capita method mirrors its total method.

      LOCAL_ONLY        4,900,000.00 - 5,000,000.00 = -100,000.00       -> FAIL
      STATE_AND_LOCAL   8,100,000.00 - 8,000,000.00 = +100,000.00       -> PASS
      LOCAL_PER_CAPITA  4,900,000.00 x 1,000 = 4,900,000,000.00
                        5,000,000.00 x 1,000 = 5,000,000,000.00         -> FAIL
      STATE_AND_LOCAL_PER_CAPITA
                        8,100,000.00 x 1,000 = 8,100,000,000.00
                        8,000,000.00 x 1,000 = 8,000,000,000.00         -> PASS

      Two methods qualify, so the year is compliant. Repayment arises only on a failure of
      the standard, so the exposure bounds are null - not zero, which would assert that a
      liability was computed and came out at nothing.

  - case: fail-under-all-four-methods-reports-a-bounded-repayment-range
    intent: fail
    asserts: >-
      A reduction below the comparison level under every permitted method fails the
      standard; which method's shortfall fixes the repayment is unresolved, so the
      calculator bounds the exposure instead of naming one figure.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '4800000.00'
      current_actual_state_local: '7700000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0002
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
    expect:
      status: FAIL
      missingInputs: []
      output:
        qualifyingMethods: []
        shortfallByMethod:
          LOCAL_ONLY: '200000.00'
          STATE_AND_LOCAL: '300000.00'
          LOCAL_PER_CAPITA: '200000.00'
          STATE_AND_LOCAL_PER_CAPITA: '300000.00'
        smallestShortfall: '200000.00'
        largestShortfall: '300000.00'
        repaymentExposureBounds:
          low: '200000.00'
          high: '300000.00'
      warnings:
        - REPAYMENT_METHOD_SELECTION_UNRESOLVED
    derivation: |
      Child counts are equal at 1,000, so each per-capita method mirrors its total method
      and each per-capita dollar shortfall equals the total-method shortfall.

      LOCAL_ONLY        5,000,000.00 - 4,800,000.00 = 200,000.00 short  -> FAIL
      STATE_AND_LOCAL   8,000,000.00 - 7,700,000.00 = 300,000.00 short  -> FAIL
      LOCAL_PER_CAPITA  (5,000,000.00 x 1,000 - 4,800,000.00 x 1,000) / 1,000
                        = 200,000.00 short                              -> FAIL
      STATE_AND_LOCAL_PER_CAPITA  = 300,000.00 short                    -> FAIL

      All four evaluated and all four failed, so the standard was not met. The smallest
      shortfall is 200,000.00 and the largest 300,000.00; both are below the 1,450,000.00
      subgrant, so the cap does not bind and the bounds are the raw shortfalls. Reporting
      the smallest as the repayment would state as settled a question counsel has not
      answered, and the amount is what a district pays.

  - case: fail-where-the-part-b-subgrant-caps-both-ends-of-the-exposure
    intent: fail
    asserts: >-
      The repayment cannot exceed the LEA's Part B subgrant for the year; where the cap
      binds it fixes both ends of the exposure range at the subgrant amount.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '120000.00'
      current_actual_local: '4650000.00'
      current_actual_state_local: '7550000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0003
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
    expect:
      status: FAIL
      output:
        qualifyingMethods: []
        smallestShortfall: '350000.00'
        largestShortfall: '450000.00'
        repaymentExposureBounds:
          low: '120000.00'
          high: '120000.00'
    derivation: |
      LOCAL_ONLY and LOCAL_PER_CAPITA   5,000,000.00 - 4,650,000.00 = 350,000.00 short
      STATE_AND_LOCAL and its per-capita 8,000,000.00 - 7,550,000.00 = 450,000.00 short
      (child counts equal at 1,000, so the per-capita methods mirror the totals)

      Exposure is the lesser of the shortfall and the subgrant, applied at each end:
        low  = min(350,000.00, 120,000.00) = 120,000.00
        high = min(450,000.00, 120,000.00) = 120,000.00
      The cap collapses the range, so here the unresolved choice of governing method does
      not change the dollar figure - which is worth reporting, because it means this
      district's exposure can be stated without waiting on counsel.

  - case: boundary-exact-equality-passes-and-one-cent-below-fails
    intent: boundary
    asserts: >-
      Spending exactly the comparison level reduces nothing and satisfies the standard;
      one cent below it does not, and there is no de minimis tolerance.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '5000000.00'
      current_actual_state_local: '7999999.99'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0004
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
    expect:
      status: PASS
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - LOCAL_PER_CAPITA
        marginByMethod:
          LOCAL_ONLY: '0.00'
          STATE_AND_LOCAL: '-0.01'
        shortfallByMethod:
          STATE_AND_LOCAL: '0.01'
        repaymentExposureBounds: null
    derivation: |
      LOCAL_ONLY        5,000,000.00 - 5,000,000.00 =  0.00             -> PASS
      STATE_AND_LOCAL   7,999,999.99 - 8,000,000.00 = -0.01             -> FAIL
      Child counts equal at 1,000:
      LOCAL_PER_CAPITA  5,000,000.00 x 1,000 on both sides              -> PASS
      STATE_AND_LOCAL_PER_CAPITA
                        7,999,999.99 x 1,000 = 7,999,999,990.00
                        8,000,000.00 x 1,000 = 8,000,000,000.00         -> FAIL

      One qualifying method is sufficient, so the year is compliant and no exposure is
      computed. The one-cent shortfall is still reported on the method that produced it,
      because a district reconciling its own ledger needs to see it.

  - case: boundary-per-capita-equality-at-a-non-terminating-quotient
    intent: boundary
    asserts: >-
      Per-capita levels that are exactly equal but non-terminating as decimals satisfy the
      standard; the equality is established by cross-multiplication, never by comparing two
      rounded quotients.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '4800000.00'
      current_actual_state_local: '7500000.00'
      current_child_count: 1008
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0005
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1050
    expect:
      status: PASS
      output:
        qualifyingMethods:
          - LOCAL_PER_CAPITA
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: PASS
          STATE_AND_LOCAL_PER_CAPITA: FAIL
      steps:
        comparison_local_per_capita: '4761.904762'
        current_local_per_capita: '4761.904762'
    derivation: |
      LOCAL_ONLY        4,800,000.00 - 5,000,000.00 = -200,000.00       -> FAIL
      STATE_AND_LOCAL   7,500,000.00 - 8,000,000.00 = -500,000.00       -> FAIL

      LOCAL_PER_CAPITA cross-multiplied:
        4,800,000.00 x 1,050 = 5,040,000,000.00
        5,000,000.00 x 1,008 = 5,040,000,000.00
        equal                                                           -> PASS
      Both quotients are 4,761.904761904761..., displayed as 4,761.904762 at 6 dp HALF_UP.
      Had the comparison been made on those displayed values it would still have come out
      equal here, but only by luck: two levels differing in the seventh decimal place round
      to the same string, and a repayment obligation cannot turn on that.

      STATE_AND_LOCAL_PER_CAPITA cross-multiplied:
        7,500,000.00 x 1,050 = 7,875,000,000.00
        8,000,000.00 x 1,008 = 8,064,000,000.00                         -> FAIL

  - case: missing-comparison-child-count-two-failures-and-two-unanswerable-is-not-a-failure
    intent: missing-data
    asserts: >-
      The platform will not tell a district it owes a repayment on the strength of a
      calculation it could not complete.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '4800000.00'
      current_actual_state_local: '7700000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0006
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
    expect:
      status: INDETERMINATE
      missingInputs:
        - comparison_child_count
      output:
        qualifyingMethods: []
        methodStatus:
          LOCAL_ONLY: FAIL
          STATE_AND_LOCAL: FAIL
          LOCAL_PER_CAPITA: INDETERMINATE
          STATE_AND_LOCAL_PER_CAPITA: INDETERMINATE
        repaymentExposureBounds: null
    derivation: |
      LOCAL_ONLY        4,800,000.00 - 5,000,000.00 = -200,000.00       -> FAIL
      STATE_AND_LOCAL   7,700,000.00 - 8,000,000.00 = -300,000.00       -> FAIL
      Neither per-capita method has a comparison-year denominator, so neither runs.

      The standard is satisfied by any one of the four methods and two of them were never
      evaluated. Reporting FAIL would assert a repayment obligation on the assumption that
      the unevaluated methods would also have failed, which nothing in the inputs supports.

  - case: missing-subgrant-amount-cannot-unmake-a-compliant-year
    intent: missing-data
    asserts: >-
      The subgrant amount bounds a repayment and nothing else; where the year is compliant
      it could not have changed the answer, so its absence is a recorded gap rather than an
      indeterminacy.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      current_actual_local: '5100000.00'
      current_actual_state_local: '8200000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0007
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
    expect:
      status: PASS
      missingInputs: []
      output:
        qualifyingMethods:
          - LOCAL_ONLY
          - STATE_AND_LOCAL
          - LOCAL_PER_CAPITA
          - STATE_AND_LOCAL_PER_CAPITA
        repaymentExposureBounds: null
        dataGapsObserved:
          - lea_part_b_subgrant_amount
    derivation: |
      LOCAL_ONLY        5,100,000.00 - 5,000,000.00 = +100,000.00       -> PASS
      STATE_AND_LOCAL   8,200,000.00 - 8,000,000.00 = +200,000.00       -> PASS
      Child counts equal at 1,000, so both per-capita methods pass with them.

      No shortfall arises, so there is nothing for the subgrant to cap. The gap is recorded
      for the administrator but the result did not depend on it.

  - case: missing-subgrant-amount-leaves-an-otherwise-failing-year-unanswerable
    intent: missing-data
    asserts: >-
      A compliance failure carries a repayment obligation the calculator cannot bound
      without the subgrant amount, so the finding is not issued on the arithmetic alone.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      current_actual_local: '4800000.00'
      current_actual_state_local: '7700000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0008
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
    expect:
      status: INDETERMINATE
      missingInputs:
        - lea_part_b_subgrant_amount
      output:
        qualifyingMethods: []
        smallestShortfall: '200000.00'
        largestShortfall: '300000.00'
        repaymentExposureBounds: null
      warnings:
        - REPAYMENT_CANNOT_BE_BOUNDED
    derivation: |
      All four methods fail, exactly as in
      fail-under-all-four-methods-reports-a-bounded-repayment-range: shortfalls of
      200,000.00 on the local measures and 300,000.00 on the State-and-local measures.

      The consequence of a failure is a recovery of the lesser of the shortfall and the
      subgrant. With the subgrant absent the lesser cannot be taken, so the exposure is
      unbounded above. This is the one place where an input that does not enter the
      compliance test itself nonetheless decides whether the finding may issue: the finding
      is the failure and its consequence together, and the platform does not publish half
      of it. The shortfall figures are still reported so the district can see what is at
      stake once the subgrant amount arrives.

  - case: manual-review-claimed-exception-names-no-enumerated-ground
    intent: manual-review
    asserts: >-
      A claimed reduction that does not name one of the enumerated 34 CFR 300.204 grounds
      is a refusal to compute, not a silently ignored claim.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '4800000.00'
      current_actual_state_local: '8100000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0009
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
      claimed_exceptions:
        - ground: STATE_AID_REDUCTION
          source: LOCAL
          amount: '250000.00'
          basis_description: State aid to the district was cut mid-year.
          event_fiscal_year_start: '2025-07-01'
          evidence_ref: EV-MISC-0009
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
        repaymentExposureBounds: null
      warnings:
        - UNRECOGNISED_EXCEPTION_GROUND
    derivation: |
      The State-and-local measures would qualify without the claim
      (8,100,000.00 >= 8,000,000.00, child counts equal), so the run would otherwise report
      PASS. It is refused anyway.

      STATE_AID_REDUCTION is not one of the five enumerated grounds. Reporting the PASS
      would tell an SEA the year is clean while the district believes it is relying on a
      250,000.00 reduction the platform silently discarded, and the district's own account
      of why it spent less would never reach the reviewer.

  - case: manual-review-costly-program-exception-without-the-sea-determination
    intent: manual-review
    asserts: >-
      The 34 CFR 300.204(c) ground is conditioned on an SEA determination that the program
      was exceptionally costly; a claim that omits the determination is refused rather than
      admitted at face value.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '4800000.00'
      current_actual_state_local: '7700000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0010
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
      claimed_exceptions:
        - ground: TERMINATION_OF_EXCEPTIONALLY_COSTLY_PROGRAM
          source: LOCAL
          amount: '260000.00'
          child_departure_reason: AGED_OUT_OF_FAPE_OBLIGATION
          basis_description: One child's residential placement ended at the FAPE age limit.
          event_fiscal_year_start: '2025-07-01'
          evidence_ref: EV-204C-0010
    expect:
      status: MANUAL_REVIEW
      output:
        qualifyingMethods: []
      warnings:
        - EXCEPTION_GROUND_CONDITION_NOT_SUPPLIED
    derivation: |
      Admitting the claim would give a required local level of
      5,000,000.00 - 260,000.00 = 4,740,000.00 against actual local expenditure of
      4,800,000.00 - a PASS by 60,000.00. Rejecting it silently would give a FAIL with a
      200,000.00 shortfall. The two answers are 260,000.00 apart and the difference turns
      entirely on a determination nobody supplied.

      The departure reason is present and enumerated; the SEA determination reference is
      not. The entry carries no student identifier, which is correct - the identifying
      material belongs in the evidence document, not in a calculator input.

  - case: exception-personnel-departure-cures-a-shortfall-on-the-local-methods
    intent: exception
    asserts: >-
      An evidenced 34 CFR 300.204(a) reduction lowers the required level for the methods it
      is claimed against, and one qualifying method carries the year.
    inputs:
      current_fiscal_year_start: '2025-07-01'
      current_fiscal_year_end: '2026-06-30'
      federal_funds_excluded: true
      lea_part_b_subgrant_amount: '1450000.00'
      current_actual_local: '4850000.00'
      current_actual_state_local: '7900000.00'
      current_child_count: 1000
      comparison_fiscal_year_start: '2024-07-01'
      comparison_basis: ACTUAL_EXPENDITURE
      comparison_year_moe_status: MET
      comparison_year_methods_met:
        - LOCAL_ONLY
        - STATE_AND_LOCAL
        - LOCAL_PER_CAPITA
        - STATE_AND_LOCAL_PER_CAPITA
      moe_status_source_run_id: RUN-MOE-COMPLIANCE-2024-0011
      comparison_actual_local: '5000000.00'
      comparison_actual_state_local: '8000000.00'
      comparison_child_count: 1000
      claimed_exceptions:
        - ground: VOLUNTARY_DEPARTURE_OF_PERSONNEL
          source: LOCAL
          amount: '207000.00'
          personnel_departure_type: RETIREMENT
          basis_description: Two special education teachers retired and were replaced at lower cost.
          event_fiscal_year_start: '2025-07-01'
          evidence_ref: EV-204A-0011
    expect:
      status: PASS
      missingInputs: []
      output:
