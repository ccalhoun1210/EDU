name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and rule-pack tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Every page is force-dynamic and reads the rule packs off disk at request time, so a
      # build proves only that the code compiles. This starts the built server and checks what
      # each route actually returns — the failure mode a green build hides.
      - name: Web route smoke test
        run: pnpm smoke:web

  # Tenant isolation is the severest threat in a multi-tenant compliance platform
  # (threat model row 1), and the controls that prevent it are Postgres features —
  # FORCE row level security, composite tenant foreign keys, a non-owner application
  # role. None of that can be exercised without a real server, so the suite skips
  # locally and this job is where it actually runs. A green `verify` job does not
  # mean isolation holds; this one does.
  database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: complianceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace packages resolve through their built `dist/`, so the suite needs a build
      # before it can import `@complianceos/domain`. The `verify` job gets this for free from
      # `pnpm typecheck`; this job has to ask for it.
      - name: Build workspace packages
        run: pnpm exec tsc --build

      - name: Tenant isolation, migration and authorization tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/complianceos_test
          # Turns a skipped isolation or authorization suite into a failure. Only this job
          # sets it: the `verify` job runs the same projects and legitimately has no
          # database.
          REQUIRE_DATABASE_TESTS: '1'
        # `identity` as well as `db`: principal resolution is where a revoked membership
        # stops conferring authority and where one tenant fails to reach another's user,
        # and both of those are claims only a real Postgres can settle.
        run: pnpm exec vitest run --project db --project identity

      # The unit suites prove each piece; only this proves they are wired to each other. A
      # sealer that verifies correctly and a page that never calls it both pass their own
      # tests. Needs a build, because it drives the production server over real HTTP.
      - name: Build the web application
        run: pnpm --filter @complianceos/web build

      - name: Connected sign-in path, end to end
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/complianceos_test
          REQUIRE_DATABASE_TESTS: '1'
        run: pnpm smoke:auth

      # The other half: a posted file becoming rows, and the page reading those rows back.
      # A route that never calls the store and a page that renders the worked example over a
      # real district's run both pass every unit suite.
      - name: District upload and persisted run, end to end
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/complianceos_test
          REQUIRE_DATABASE_TESTS: '1'
        run: pnpm smoke:upload

  data-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Customer data, student records and district exports must never enter the repo.
      # .gitignore is the first line of defence; this job is the second.
      - name: Reject data files
        run: |
          matches=$(git ls-files '*.csv' '*.xlsx' '*.xls' '*.sqlite' | grep -v '^docs/' || true)
          if [ -n "$matches" ]; then
            echo "Data files committed outside docs/:"
            echo "$matches"
            exit 1
          fi

      - name: Reject populated env files
        run: |
          matches=$(git ls-files '.env' '.env.*' | grep -v '\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "Environment files committed:"
            echo "$matches"
            exit 1
          fi
