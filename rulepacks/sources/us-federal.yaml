# ---------------------------------------------------------------------------
# Federal regulatory source library
#
# Spec: Master Technical Buildout sections 9 and 41.
#
# READ THIS BEFORE ADVANCING ANY RULE PAST QA_APPROVED.
#
# Every entry below has `retrieval: null`. That is not an oversight and it is not a
# placeholder to be filled in with a plausible-looking hash. It means precisely what the
# schema says it means: the official text at `officialUrl` has not been fetched, hashed and
# archived, so no rule citing it may reach STAGED, SHADOW or ACTIVE.
# `assertRuleSourcesVerified` enforces that, and the rule-pack test suite calls it.
#
# The build environment these entries were authored in has no route to ecfr.gov — outbound
# requests to it are refused by the egress policy. Rather than transcribe regulatory text
# from memory and present it as authoritative, the citations record *where the answer is*
# and the retrieval record records *that nobody has looked yet*.
#
# To verify a source: fetch the document at `officialUrl`, archive the exact bytes, record
# the SHA-256 as `documentHash`, and fill in `retrievedOn`, `archiveRef` and `retrievedBy`.
# Then, separately, confirm that each rule citing it actually implements what it says. The
# retrieval record proves the text was obtained; a domain reviewer's approval is what proves
# the rule matches it. They are different gates and both are required by section 35.
# ---------------------------------------------------------------------------

registryId: US-FEDERAL
description: >-
  Federal authorities for IDEA Part B fiscal compliance and the Uniform Guidance provisions
  that govern records and internal controls for the same funds.

